<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Authority Registration</title>

    <link rel="stylesheet" href="/Nit-Hackathon/frontend/style_new.css">

</head>


<body class="login-page">


<div class="form-container">


    <h2>Authority Registration</h2>


    <form action="/Nit-Hackathon/frontend/LMO_dashboard.html">


        <div class="form-group">

            <label>Full Name</label>

            <input
                type="text"
                required>

        </div>



        <div class="form-group">

            <label>Government ID</label>

            <input
                type="text"
                required>

        </div>



        <div class="form-group">

            <label>Phone Number</label>

            <input
                type="tel"
                required>

        </div>



        <div class="form-group">

            <label>Create Password</label>

            <input
                type="password"
                required>

        </div>



        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                required>

        </div>



        <button
            type="submit"
            class="submit-button">

            Register

        </button>


    </form>



    <div class="back-link">

        <a href="/Nit-Hackathon/frontend/officer-login.html">

            ← Back to Login

        </a>

    </div>


</div>


</body>

</html>
