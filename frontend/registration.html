<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .optional {
            font-size: 12px;
            color: gray;
        }

        .login-link{
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #007bff;
            text-decoration: none;
        }

        .login-link a:hover{
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Registration Form</h2>

        <form action="/Nit-Hackathon/frontend/success.html">

            <!-- Name -->
            <label for="name">Full Name</label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                placeholder="Enter your full name"
                required
            >
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" placeholder="Enter DoB" required
            >


            <!-- Phone Number -->
            <label for="phone">Phone Number</label>
            <input 
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10-digit phone number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >

            <!-- Email -->
            <label for="email">
                Email 
                <span class="optional">(Optional)</span>
            </label>

            <input 
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
            >


            <!-- Aadhaar Number -->
            <label for="aadhaar">Aadhaar Number</label>
            <input 
                type="text"
                id="aadhaar"
                name="aadhaar"
                placeholder="Enter 12-digit Aadhaar number"
                pattern="[0-9]{12}"
                maxlength="12"
                required
            >

            <!-- Password -->
            <label for="password">Create Password</label>
            <input 
                type="password"
                id="password"
                name="password"
                placeholder="Create a strong password"
                minlength="6"
                required
            >

            <label for="pass">Confirm Password</label>
            <input type="password" id="pass" name="pass" placeholder="Re-Enter Your Password " required>


            

            <!-- Submit Button -->
            <button type="submit">Register</button>

        </form>

        
        <p class="login-link">
            Already Registered? 

            <a href="/Nit-Hackathon/frontend/Login_form.html" target="_blank">
                Login here
            </a>

        </p>

    </div>

</body>
</html>
