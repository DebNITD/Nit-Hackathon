<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Registration</title>

    <link rel="stylesheet"
          href="/Nit-Hackathon/frontend/style_new.css">

</head>


<body class="login-page">


<div class="form-container">


    <h2>User Registration</h2>


    <form onsubmit="registerUser(event)">


        <!-- NAME -->

        <div class="form-group">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required>

        </div>



        <!-- USER ID -->

        <div class="form-group">

            <label>User ID</label>

            <input
                type="text"
                id="userId"
                placeholder="Create User ID"
                required>

        </div>



        <!-- DATE OF BIRTH -->

        <div class="form-group">

            <label>Date of Birth</label>

            <input
                type="date"
                id="dob"
                required>

        </div>



        <!-- PHONE -->

        <div class="form-group">

            <label>Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                required>

        </div>



        <!-- EMAIL -->

        <div class="form-group">

            <label>

                Email
                (Optional)

            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter email address">

        </div>



        <!-- PASSWORD -->

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                required>

        </div>



        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required>

        </div>



        <button
            type="submit"
            class="submit-button">

            Register

        </button>


    </form>



    <div class="register-link">

        Already have an account?

        <a href="/Nit-Hackathon/frontend/user-login.html">

            Login Here

        </a>

    </div>


</div>


<script src="/Nit-Hackathon/frontend/javascript.js"></script>


</body>

</html>
